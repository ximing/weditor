name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "./packages/*" build
      - name: Build docs
        run: pnpm --filter @deditor/docs build
        env:
          DOCS_BASE: /weditor/
      - name: Build demo
        run: pnpm --filter @deditor/demo build
        env:
          DEMO_BASE: /weditor/demo/
      - name: Assemble site
        run: |
          mkdir -p site/demo
          cp -R apps/docs/.vitepress/dist/. site/
          cp -R apps/demo/dist/. site/demo/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
